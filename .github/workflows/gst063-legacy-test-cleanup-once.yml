name: GST-063 Legacy Test Cleanup Once

on:
  push:
    branches:
      - fix/gst063-route-registry-2026-09-06
    paths:
      - '.github/workflows/gst063-legacy-test-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/gst063-route-registry-2026-09-06
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Verify exact source blob and retire stale assertions
        shell: bash
        run: |
          set -euo pipefail
          target='desktop/Desktop_Hooks/LightSpeed/tests/test_runtime_package.py'
          expected_blob='dc6df6e2594d5d2495b225e70ad6b01f4472d291'
          actual_blob="$(git hash-object "$target")"
          test "$actual_blob" = "$expected_blob"
          python - <<'PY'
          from pathlib import Path

          path = Path('desktop/Desktop_Hooks/LightSpeed/tests/test_runtime_package.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert len(payload["squarespace_routes"]) == 31
              assert any(item["route"] == "/ls-go/handoff" for item in payload["squarespace_routes"])
              assert any(item["route"] == "/tools/calculators" for item in payload["squarespace_routes"])
              assert all(str(item["route"]).startswith("/") for item in payload["squarespace_routes"])
          '''
          new = '''    staged_routes = [str(item["route"]) for item in payload["squarespace_routes"]]
              staged_route_set = set(staged_routes)
              assert len(staged_routes) == len(staged_route_set)
              assert "/ls-go/handoff" in staged_route_set
              assert {f"/operations/w{i}" for i in range(1, 7)} <= staged_route_set
              assert {f"/w{i}/data" for i in range(1, 7)} <= staged_route_set
              assert "/library" in staged_route_set
              assert "/tools/calculators" not in staged_route_set
              assert "/workspaces" not in staged_route_set
              assert all(f"/w{i}/work" not in staged_route_set for i in range(1, 7))
              assert all(route.startswith("/") for route in staged_routes)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected stale assertion block exactly once; found {text.count(old)}')
          if new in text:
              raise SystemExit('replacement block already present')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run targeted legacy and GST-063 semantic tests
        env:
          PYTHONPATH: desktop/LightSpeed_Runtime
        run: >-
          python -m pytest -q
          desktop/Desktop_Hooks/LightSpeed/tests/test_runtime_package.py::test_romer_web_integration_contract_maps_public_site_and_drive_feeds
          desktop/Desktop_Hooks/LightSpeed/tests/test_gst063_route_contract.py
          desktop/Desktop_Hooks/LightSpeed/tests/test_gst063_route_semantics.py

      - name: Self-remove and verify exact diff scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/gst063-legacy-test-cleanup-once.yml
          printf '%s\n' \
            '.github/workflows/gst063-legacy-test-cleanup-once.yml' \
            'desktop/Desktop_Hooks/LightSpeed/tests/test_runtime_package.py' | sort > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check

      - name: Commit bounded cleanup and restore read-only workflow posture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/Desktop_Hooks/LightSpeed/tests/test_runtime_package.py .github/workflows/gst063-legacy-test-cleanup-once.yml
          git commit -m 'test(gst063): retire stale route assertions'
          git push origin HEAD:fix/gst063-route-registry-2026-09-06
