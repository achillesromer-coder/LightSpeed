name: Mark III v0.3.3 Source Materialisation

on:
  pull_request:
    branches:
      - execution/luke-ii-parametric-reference-2026-08-04
    paths:
      - ".markiii-v033-bundle/**"
      - ".github/workflows/mark-iii-reference-validation.yml"
      - "desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/mark_iii/**"
  push:
    branches:
      - execution/mark-iii-original-layout-v0.3-2026-08-05
    paths:
      - ".markiii-v033-bundle/**"
      - ".github/workflows/mark-iii-reference-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mark-iii-v033-materialise-${{ github.ref }}
  cancel-in-progress: true

env:
  MARK_DIR: desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/mark_iii

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: execution/mark-iii-original-layout-v0.3-2026-08-05
          fetch-depth: 1
          show-progress: false

      - name: Verify and materialise v0.3.3 source bundle
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G ".markiii-v033-bundle/source-*.b64" > /dev/null; then
            echo "No staged bundle present; source is already materialised."
            exit 0
          fi

          cat .markiii-v033-bundle/source-*.b64 | base64 --decode > "$RUNNER_TEMP/markiii-v033-source.tar.gz"
          echo "5ad1aa68fae97794808a444d5a73b7aab30334b0495a4f9ba8930ab5bb68652f  $RUNNER_TEMP/markiii-v033-source.tar.gz" | sha256sum --check --strict
          tar -tzf "$RUNNER_TEMP/markiii-v033-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/markiii-v033-source.tar.gz" -C "$MARK_DIR"

          git rm -r .markiii-v033-bundle
          if [ -d .markiii-v033 ]; then git rm -r .markiii-v033; fi
          git add "$MARK_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine Mark III v0.3.3 propulsion and review closure"
          git push origin HEAD:execution/mark-iii-original-layout-v0.3-2026-08-05
