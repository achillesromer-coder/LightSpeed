name: CGX Link Android test APK

on:
  push:
    branches:
      - build/cgx-android-test-apk-20261013
  workflow_dispatch:
  pull_request:
    branches:
      - feature/lsgo-mobile-link-20261013

permissions:
  contents: read

jobs:
  build-cgx-link-apk:
    name: Build Android CGX handler (test only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify preinstalled Android SDK and install SDK 35 platform
        shell: bash
        run: |
          set -euo pipefail
          echo "Android home: ${ANDROID_HOME:-unset}"
          SDK_BASE="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_BASE/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMGR"
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug-signed CGX Link APK
        shell: bash
        run: |
          gradle -p apps/cgx-android-link --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signing and package identity
        shell: bash
        run: |
          set -euo pipefail
          SDK_BASE="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK="apps/cgx-android-link/app/build/outputs/apk/debug/app-debug.apk"
          "$SDK_BASE/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee SIGNATURE-INFO.txt
          "$SDK_BASE/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5 | tee PACKAGE-INFO.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' SIGNATURE-INFO.txt
          grep -q "package: name='au.com.cognigrex.cgxlink'" PACKAGE-INFO.txt

      - name: Record APK checksum and provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/cgx-android-link/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p cgx-android-apk-output
          cp apps/cgx-android-link/app/build/outputs/apk/debug/app-debug.apk cgx-android-apk-output/CGX-Link-Android-Test.apk
          cd cgx-android-apk-output
          sha256sum CGX-Link-Android-Test.apk > SHA256SUMS.txt
          cp ../SIGNATURE-INFO.txt ../PACKAGE-INFO.txt .
          printf 'Source SHA: %s\nVariant: debug; test only, not production\nPackage: au.com.cognigrex.cgxlink\n' "$GITHUB_SHA" > BUILD-INFO.txt
          ls -lh CGX-Link-Android-Test.apk

      - name: Upload private test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CGX-Link-Android-Test-APK
          path: cgx-android-apk-output/
          if-no-files-found: error
          retention-days: 14
