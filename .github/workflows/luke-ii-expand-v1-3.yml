name: Expand Luke II v1.3 Source

on:
  push:
    branches:
      - execution/luke-ii-parametric-reference-2026-08-04
    paths:
      - "desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/luke_ii/luke_ii_v1_3_source_bundle_parts/**"
      - ".github/workflows/luke-ii-expand-v1-3.yml"

permissions:
  contents: write

concurrency:
  group: luke-ii-v1-3-source-expansion
  cancel-in-progress: false

env:
  LUKE_DIR: desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/luke_ii
  BUNDLE_SHA256: fbcb8bf8daeedfc8a800cfff3252f6ea4781ea9dce9127652c3b2e3527f6aa60

jobs:
  expand:
    name: Materialise qualified Luke II v1.3 source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: execution/luke-ii-parametric-reference-2026-08-04
          fetch-depth: 0

      - name: Reassemble and expand deterministic source bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/luke-ii-v1-3-source.zip"
          staging="$RUNNER_TEMP/luke-ii-v1-3-source"
          cat "$LUKE_DIR"/luke_ii_v1_3_source_bundle_parts/part_* > "$bundle"
          echo "$BUNDLE_SHA256  $bundle" | sha256sum -c -
          mkdir -p "$staging"
          unzip -q "$bundle" -d "$staging"
          cp -f "$staging"/source/* "$LUKE_DIR"/
          cp -f "$staging/_workflow/luke-ii-reference-validation.yml" .github/workflows/luke-ii-reference-validation.yml
          rm -rf "$LUKE_DIR/luke_ii_v1_3_source_bundle_parts"
          rm -f .github/workflows/luke-ii-expand-v1-3.yml

      - name: Commit full source and validation gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialise Luke II v1.3 serviceable reference source"
          git push origin HEAD:execution/luke-ii-parametric-reference-2026-08-04
