name: CGX Component Atlas Validation

on:
  pull_request:
    paths:
      - "cgx/component_atlas/**"
      - "cgx/manufacturing/**"
      - "tests/test_cgx_component_atlas.py"
      - "tests/test_cgx_component_instance_contract.py"
      - "tests/test_pc01_printceptor_contract.py"
      - "tests/test_cgx_manufacturing_compiler.py"
      - "tests/test_run_cgx_printspace_batch.py"
      - "tests/test_printspace_pre_dbr_archive_register.py"
      - "scripts/validate_printspace_pre_dbr.py"
      - "tests/test_printspace_owner_matrix_projection.py"
      - "tests/test_printspace_composition.py"
      - "tests/test_printspace_exact_contact.py"
      - "tests/test_printspace_interface_witness_plan.py"
      - "tests/test_printspace_solid_metrics.py"
      - "tests/test_printspace_digital_service_stack.py"
      - "tests/test_printspace_tolerance_clearance.py"
      - "tests/test_printspace_cross_domain_emulation.py"
      - "tests/test_printspace_virtual_factory.py"
      - "tests/test_printspace_cgx_bundle.py"
      - "tests/test_printspace_host_preflight.py"
      - "scripts/build_printspace_host_preflight.py"
      - "cgx/manufacturing/printspace_host_preflight.py"
      - "cgx/manufacturing/printspace_host_r0_review_v0_1.json"
      - "apps/lightspeed-go/src/printspaceCgxHostR0Bridge.mjs"
      - "apps/lightspeed-go/src/printspaceCgxHostR0Bridge.test.mjs"
      - "scripts/build_printspace_cgx_bundle.py"
      - "docs/engineering/PRINTSPACE_CGX_FILESPACE_FACETS_2026-11-22.md"
      - "scripts/build_printspace_studio.py"
      - "scripts/run_cgx_printspace_batch.py"
      - "docs/engineering/PC01_RAPHAEL_PRINTSPACE_CROSSWALK_2026-11-22.md"
      - "tests/test_cgx_exact_binding_bridge.py"
      - "tests/test_cgx_printable_4d_stack.py"
      - "tests/test_cgx_volumetric_kernel.py"
      - "tests/test_cgx_quantitative_invariants.py"
      - "tests/test_cgx_compound_decomposition.py"
      - "tests/test_type1_equation_kernel.py"
      - "tests/test_universal_type1_stack_compiler.py"
      - "scripts/compile_cgx_manufacturing.py"
      - "docs/engineering/CGX_COMPONENT_GEOMETRY_ATLAS_2026-10-08.md"
      - "docs/engineering/PC01_PRINTCEPTOR_OPERATIONAL_CONVERGENCE_2026-10-09.md"
      - ".github/workflows/cgx-component-atlas-validation.yml"
  push:
    branches:
      - main
    paths:
      - "cgx/component_atlas/**"
      - "cgx/manufacturing/**"
      - "tests/test_cgx_component_atlas.py"
      - "tests/test_cgx_component_instance_contract.py"
      - "tests/test_pc01_printceptor_contract.py"
      - "tests/test_cgx_manufacturing_compiler.py"
      - "tests/test_run_cgx_printspace_batch.py"
      - "tests/test_printspace_pre_dbr_archive_register.py"
      - "scripts/validate_printspace_pre_dbr.py"
      - "tests/test_printspace_owner_matrix_projection.py"
      - "tests/test_printspace_composition.py"
      - "tests/test_printspace_exact_contact.py"
      - "tests/test_printspace_interface_witness_plan.py"
      - "tests/test_printspace_solid_metrics.py"
      - "tests/test_printspace_digital_service_stack.py"
      - "tests/test_printspace_tolerance_clearance.py"
      - "tests/test_printspace_cross_domain_emulation.py"
      - "tests/test_printspace_virtual_factory.py"
      - "tests/test_printspace_cgx_bundle.py"
      - "tests/test_printspace_host_preflight.py"
      - "scripts/build_printspace_host_preflight.py"
      - "cgx/manufacturing/printspace_host_preflight.py"
      - "cgx/manufacturing/printspace_host_r0_review_v0_1.json"
      - "apps/lightspeed-go/src/printspaceCgxHostR0Bridge.mjs"
      - "apps/lightspeed-go/src/printspaceCgxHostR0Bridge.test.mjs"
      - "scripts/build_printspace_cgx_bundle.py"
      - "docs/engineering/PRINTSPACE_CGX_FILESPACE_FACETS_2026-11-22.md"
      - "scripts/build_printspace_studio.py"
      - "scripts/run_cgx_printspace_batch.py"
      - "docs/engineering/PC01_RAPHAEL_PRINTSPACE_CROSSWALK_2026-11-22.md"
      - "tests/test_cgx_exact_binding_bridge.py"
      - "tests/test_cgx_volumetric_kernel.py"
      - "tests/test_type1_equation_kernel.py"
      - "tests/test_universal_type1_stack_compiler.py"
      - "scripts/compile_cgx_manufacturing.py"
      - "docs/engineering/CGX_COMPONENT_GEOMETRY_ATLAS_2026-10-08.md"
      - "docs/engineering/PC01_PRINTCEPTOR_OPERATIONAL_CONVERGENCE_2026-10-09.md"
      - ".github/workflows/cgx-component-atlas-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate component atlas
        run: python -m pytest -q tests/test_cgx_component_atlas.py
      - name: Validate component instance and proof contracts
        run: python -m pytest -q tests/test_cgx_component_instance_contract.py
      - name: Validate PC01 PrintCeptor contracts
        run: python -m pytest -q tests/test_pc01_printceptor_contract.py
      - name: Validate CGX manufacturing compiler
        run: python -m pytest -q tests/test_cgx_manufacturing_compiler.py
      - name: Validate PrintSpace process review gate
        run: python -m pytest -q tests/test_printspace_review_gate.py
      - name: Validate CGX exact-binding bridge
        run: python -m pytest -q tests/test_cgx_exact_binding_bridge.py
      - name: Validate CGX printable 4D catalogue and stacks
        run: python -m pytest -q tests/test_cgx_printable_4d_stack.py
      - name: Validate CGX volumetric topology kernel
        run: python -m pytest -q tests/test_cgx_volumetric_kernel.py
      - name: Validate UTP-138 compound decomposition templates
        run: python -m pytest -q tests/test_cgx_compound_decomposition.py
      - name: Validate UTP-139 quantitative invariants and dense smart stack
        run: python -m pytest -q tests/test_cgx_quantitative_invariants.py
      - name: Validate Type-I stack and equation kernels
        run: python -m pytest -q tests/test_universal_type1_stack_compiler.py tests/test_type1_equation_kernel.py
      - name: Validate exact PrintSpace nominal solid metrics
        run: python -m pytest -q tests/test_printspace_solid_metrics.py
      - name: Validate native R0 PrintSpace / UniSpace host and LOAD review crosswalk
        run: python -m pytest -q tests/test_printspace_host_preflight.py && python scripts/build_printspace_host_preflight.py --check && node --check apps/lightspeed-go/src/printspaceCgxHostR0Bridge.mjs
      - name: Validate PrintSpace CGX FileSpace facets, H0 and offline lossless source replay
        run: python -m pytest -q tests/test_printspace_cgx_bundle.py && python scripts/build_printspace_cgx_bundle.py --check
      - name: Validate PrintSpace virtual factory source, 756-scenario sweep and offline UI generation
        run: python -m pytest -q tests/test_printspace_virtual_factory.py && python scripts/build_printspace_studio.py --check
      - name: Validate bounded PrintSpace cross-domain emulation and sequence laws
        run: python -m pytest -q tests/test_printspace_cross_domain_emulation.py
      - name: Validate synthetic static PrintSpace tolerance screen
        run: python -m pytest -q tests/test_printspace_tolerance_clearance.py
      - name: Validate bottom-up CGX digital services and reverse source trace
        run: python -m pytest -q tests/test_printspace_digital_service_stack.py
      - name: Validate directional PrintSpace witness plan
        run: python -m pytest -q tests/test_printspace_interface_witness_plan.py
      - name: Validate exact convex PrintSpace contact
        run: python -m pytest -q tests/test_printspace_exact_contact.py
      - name: Validate CGX PrintSpace geometry composition
        run: python -m pytest -q tests/test_printspace_composition.py
      - name: Validate PrintSpace pre-DBR archive review register
        run: python -m pytest -q tests/test_printspace_pre_dbr_archive_register.py && python scripts/validate_printspace_pre_dbr.py
      - name: Validate PrintSpace sequential batch harness
        run: python -m pytest -q tests/test_run_cgx_printspace_batch.py
      - name: Run bounded comprehensive PrintSpace batch
        run: python scripts/run_cgx_printspace_batch.py --profile comprehensive --step-limit-seconds 240 --total-limit-seconds 1200 --rest-seconds 0.25 --output-dir "$RUNNER_TEMP/cgx-printspace-batch"
      - name: Compile synthetic PrintSpace composite pilot receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from cgx.manufacturing import compile_geometry_composition
          src = Path("cgx/manufacturing/printspace_composite_pilot_v0_1.json")
          data = json.loads(src.read_text(encoding="utf-8"))
          result = compile_geometry_composition(data)
          assert result["state"] == "REVIEW_ONLY", result["hold_codes"]
          assert len(result["graph"]["instances"]) == 3
          assert len(result["graph"]["shape_catalogue"]) == 2
          assert len(result["graph"]["interfaces"]) == 2
          assert all(e["exact_convex_contact"]["relation"] == "FACE_CONTACT" for e in result["graph"]["interfaces"])
          assert all(e["exact_convex_contact"]["face_area_mm2_exact"] == "16" for e in result["graph"]["interfaces"])
          assert all(e["physical_compatibility"] == "NOT_VERIFIED" for e in result["graph"]["interfaces"])
          assert result["machine_authorised"] is False
          assert result["mint_authorised"] is False
          assert result["rights_verified"] is False
          assert result["load_h0"]["source_bytes_hydrated"] == 0
          out = Path(os.environ["RUNNER_TEMP"]) / "cgx-printspace-batch"
          out.mkdir(parents=True, exist_ok=True)
          target = out / "pc01-synthetic-composition-review.json"
          target.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          # Same canonical geometry, same owner Drive metadata projection.
          # The receipt is a source-indexed TEST PLAN, not observed materials.
          from cgx.manufacturing import plan_interface_witnesses
          from cgx.manufacturing import compile_component, find_archetype, load_default_atlas
          ir = compile_component(find_archetype(load_default_atlas(), "PN rectifier diode"),
                                 build_id="pc01-three-layer-coupon")
          selections = json.loads(Path("cgx/manufacturing/pc01_interface_witness_plan_v0_1.json").read_text())
          selections["manufacturing_ir_configuration_hash"] = ir["configuration_hash"]
          witness = plan_interface_witnesses(result, selections)
          assert witness["state"] == "PLAN_READY_UNQUALIFIED", witness["hold_codes"]
          assert len(witness["plan"]["interfaces"]) == 2
          assert sum(len(x["directions"]) for x in witness["plan"]["interfaces"]) == 4
          assert witness["material_interface_qualified"] is False
          assert witness["machine_authorised"] is False
          assert witness["evidence_independently_verified"] is False
          receipt_path = out / "pc01-synthetic-directional-witness-plan.json"
          receipt_path.write_text(json.dumps(witness, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          # Stack existing geometry, material, process scope and LOAD H0 in a
          # deterministic service DAG. Reverse trace replays original inputs;
          # not an external owner attestation or a physical qualification.
          from cgx.manufacturing import (
            compile_digital_service_stack, verify_digital_service_stack_backwards,
            measure_composite_nominal,
          )
          source_geometry = dict(data)
          source_geometry["manufacturing_ir_configuration_hash"] = ir["configuration_hash"]
          solid = measure_composite_nominal(data, result)
          assert solid["nominal_sum_volume_mm3_exact"] == "64"
          assert solid["union_volume_mm3_exact"] is None and solid["mass"] is None
          services = compile_digital_service_stack(ir, source_geometry, selections)
          assert services["state"] == "DIGITAL_STACK_REVIEW_ONLY_PHYSICAL_HOLD", services["hold_codes"]
          assert len(services["layers"]) == 12
          assert services["independent_witness_candidates"] == 4
          assert services["nominal_sum_volume_mm3_exact"] == "64"
          assert services["physically_qualified"] is False
          assert services["machine_authorised"] is False
          audit = verify_digital_service_stack_backwards(services, ir, source_geometry, selections)
          assert audit["state"] == "PASS_DIGITAL_ONLY", audit
          assert audit["machine_authorised"] is False
          (out / "pc01-synthetic-nominal-solid-metrics.json").write_text(
            json.dumps(solid, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (out / "pc01-synthetic-digital-service-stack.json").write_text(
            json.dumps(services, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (out / "pc01-synthetic-back-down-audit.json").write_text(
            json.dumps(audit, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          # This remains a static conservative synthetic AABB analysis; the
          # printhead sweep, device C0, real tool and measured placement bounds
          # are UNVERIFIED. Keep previous no-plan manifest unchanged.
          from cgx.manufacturing import screen_static_tolerances
          tol = json.loads(Path("cgx/manufacturing/pc01_tolerance_static_screen_v0_1.json").read_text())
          tol["manufacturing_ir_configuration_hash"] = ir["configuration_hash"]
          static = screen_static_tolerances(source_geometry, tol)
          assert static["state"] == "SCREENED_STATIC_DIGITAL_ONLY", static["hold_codes"]
          assert len(static["interface_uncertainty"]) == 2
          assert len(static["static_keepout_results"]) == 3
          assert sorted(e["possible_normal_gap_um"] for e in static["interface_uncertainty"]) == [100, 125]
          assert static["moving_toolpaths_evaluated"] is False
          assert static["physical_clearance_authorised"] is False
          bounded_services = compile_digital_service_stack(
            ir, source_geometry, selections, clearance_plan=tol)
          assert bounded_services["state"] == "DIGITAL_STACK_REVIEW_ONLY_PHYSICAL_HOLD"
          assert len(bounded_services["layers"]) == 12
          assert bounded_services["static_screen_sha256"] == static["screen_sha256"]
          backwards = verify_digital_service_stack_backwards(
            bounded_services, ir, source_geometry, selections, clearance_plan=tol)
          assert backwards["state"] == "PASS_DIGITAL_ONLY", backwards
          assert backwards["machine_authorised"] is False
          for name, payload in (
              ("pc01-synthetic-static-tolerance-screen.json", static),
              ("pc01-synthetic-tolerance-service-stack.json", bounded_services),
              ("pc01-synthetic-tolerance-back-down-audit.json", backwards),
          ):
              (out / name).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          # The cross-sweep is a synthetic analytic surrogate over the SAME
          # source-linked 12-service root, never real measured multiphysics.
          from cgx.manufacturing import run_cross_domain_emulation, equation_kernel_fingerprint
          experiment = json.loads(Path("cgx/manufacturing/pc01_synthetic_cross_sweep_v0_1.json").read_text())
          experiment["source_equation_library_sha256"] = equation_kernel_fingerprint()
          simulated = run_cross_domain_emulation(ir, source_geometry, selections, tol, experiment)
          assert simulated["state"] == "SYNTHETIC_FACTORIAL_SCREEN_COMPLETE_PHYSICAL_HOLD", simulated["hold_codes"]
          assert simulated["case_count"] == 216
          assert len(simulated["cross_factor_interactions"]) == 15
          assert simulated["physical_evidence_verified"] is False
          assert simulated["machine_authorised"] is False
          assert simulated["native_dbr_written"] is False
          assert simulated["external_solver_executed"] is False
          assert simulated["screening_summary"]["max_abs_energy_balance_residual_j"] < 1e-8
          (out / "pc01-synthetic-electrothermal-cross-sweep.json").write_text(
            json.dumps(simulated, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (out / "pc01-synthetic-sweep-summary.json").write_text(
            json.dumps({
              "schema": simulated["schema"],
              "source_digests": simulated["source_digests"],
              "case_count": simulated["case_count"],
              "result_sha256": simulated["result_sha256"],
              "screening_summary": simulated["screening_summary"],
              "cross_factor_interactions": simulated["cross_factor_interactions"],
              "hold_codes": simulated["hold_codes"],
              "machine_authorised": False,
              "physical_evidence_verified": False,
            }, indent=2, sort_keys=True) + "\n", encoding="utf-8")




          print(json.dumps({"state":result["state"], "geometry_composite_hash":result["geometry_composite_hash"],
            "instances":len(result["graph"]["instances"]), "source_shapes":len(result["graph"]["shape_catalogue"]),
            "load_hydration":result["load_h0"]["hydration"], "receipt":str(target)}, sort_keys=True))
          PY
      - name: Append immutable PrintSpace R0 handoff evidence receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from cgx.manufacturing import prepare_r0_host_review, verify_r0_host_review_back_down
          from cgx.manufacturing.printspace_cgx import build_bundle
          from cgx.manufacturing.virtual_factory import load_catalogue
          catalogue=load_catalogue()
          bundle=build_bundle(catalogue)
          plan=prepare_r0_host_review(bundle,catalogue)
          assert plan["state"]=="R0_CANDIDATE_REVIEW_NOT_ADMITTED"
          assert plan["candidate_count"]==0 and plan["product_count"]==3
          assert not plan["native_admitted"] and not plan["machine_authorised"]
          audit=verify_r0_host_review_back_down(plan,bundle,catalogue)
          assert audit["state"]=="PASS_DIGITAL_ONLY"
          out=Path(os.environ["RUNNER_TEMP"])/"cgx-printspace-batch"
          out.mkdir(parents=True,exist_ok=True)
          for name,value in (("pc01-printspace-native-r0-review.json",plan),
                             ("pc01-printspace-native-r0-backtrace.json",audit)):
              (out/name).write_text(json.dumps(value,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
      - name: Archive sequential checkpoints and readbacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc01-printspace-sequential-regression
          path: ${{ runner.temp }}/cgx-printspace-batch/
          if-no-files-found: warn
          retention-days: 30
      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for base in (Path("cgx/component_atlas"), Path("cgx/manufacturing")):
              for path in sorted(base.glob("*.json")):
                  json.loads(path.read_text(encoding="utf-8"))
          print("CGX component/manufacturing JSON validation PASS")
          PY