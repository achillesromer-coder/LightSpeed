name: CGX Component Atlas Validation

on:
  pull_request:
    paths:
      - "cgx/component_atlas/**"
      - "cgx/manufacturing/**"
      - "tests/test_cgx_component_atlas.py"
      - "tests/test_cgx_component_instance_contract.py"
      - "tests/test_pc01_printceptor_contract.py"
      - "tests/test_cgx_manufacturing_compiler.py"
      - "tests/test_cgx_exact_binding_bridge.py"
      - "scripts/compile_cgx_manufacturing.py"
      - "docs/engineering/CGX_COMPONENT_GEOMETRY_ATLAS_2026-10-08.md"
      - "docs/engineering/PC01_PRINTCEPTOR_OPERATIONAL_CONVERGENCE_2026-10-09.md"
      - ".github/workflows/cgx-component-atlas-validation.yml"
  push:
    branches:
      - main
    paths:
      - "cgx/component_atlas/**"
      - "cgx/manufacturing/**"
      - "tests/test_cgx_component_atlas.py"
      - "tests/test_cgx_component_instance_contract.py"
      - "tests/test_pc01_printceptor_contract.py"
      - "tests/test_cgx_manufacturing_compiler.py"
      - "scripts/compile_cgx_manufacturing.py"
      - "docs/engineering/CGX_COMPONENT_GEOMETRY_ATLAS_2026-10-08.md"
      - "docs/engineering/PC01_PRINTCEPTOR_OPERATIONAL_CONVERGENCE_2026-10-09.md"
      - ".github/workflows/cgx-component-atlas-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate component atlas
        run: python -m pytest -q tests/test_cgx_component_atlas.py
      - name: Validate component instance and proof contracts
        run: python -m pytest -q tests/test_cgx_component_instance_contract.py
      - name: Validate PC01 PrintCeptor contracts
        run: python -m pytest -q tests/test_pc01_printceptor_contract.py
      - name: Validate CGX manufacturing compiler
        run: python -m pytest -q tests/test_cgx_manufacturing_compiler.py
      - name: Validate CGX exact-binding bridge
        run: python -m pytest -q tests/test_cgx_exact_binding_bridge.py
      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for base in (Path("cgx/component_atlas"), Path("cgx/manufacturing")):
              for path in sorted(base.glob("*.json")):
                  json.loads(path.read_text(encoding="utf-8"))
          print("CGX component/manufacturing JSON validation PASS")
          PY