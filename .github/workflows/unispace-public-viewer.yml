name: UniSpace CGX Public Viewer Validation
on:
  push:
    branches: ["feature/unispace-public-cgx-20261012"]
    paths:
      - "apps/lightspeed-go/public/cgx/**"
      - "apps/lightspeed-go/tests/unispace-public.test.mjs"
      - "apps/lightspeed-go/scripts/assemble_cgx_public_site.py"
      - "tests/test_cgx_public_site_isolation.py"
      - ".github/workflows/unispace-public-viewer.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/lightspeed-go/public/cgx/**"
      - "apps/lightspeed-go/tests/unispace-public.test.mjs"
      - "apps/lightspeed-go/scripts/assemble_cgx_public_site.py"
      - "tests/test_cgx_public_site_isolation.py"
      - ".github/workflows/unispace-public-viewer.yml"
permissions:
  contents: read
jobs:
  safe-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated public files and pure CGX simulation model
        run: |
          node --check apps/lightspeed-go/public/cgx/assets/core.js
          node --check apps/lightspeed-go/public/cgx/assets/viewer.js
          node --check apps/lightspeed-go/public/cgx/assets/domain-overviews.js
          node --check apps/lightspeed-go/public/cgx/assets/domain-viewer.js
          (cd apps/lightspeed-go && npm ci --silent && npm test -- --run tests/unispace-public.test.mjs tests/unispace-domains.test.mjs)
          python -m unittest discover -s tests -p 'test_cgx_public_site_isolation.py' -v
          python apps/lightspeed-go/scripts/assemble_cgx_public_site.py --output cgx-isolated-site > cgx-public-manifest.json
          python - <<'PY'
          from pathlib import Path
          root=Path('apps/lightspeed-go/public/cgx')
          routes=['', 'fs/', 'ds/', 'ps/', 'doom/', 'romer/', 'eco/']
          files=[root/'assets/core.js',root/'assets/viewer.js',root/'assets/viewer.css',root/'assets/domain-overviews.js',root/'assets/domain-viewer.js']
          assert all(x.is_file() for x in files)
          for route in routes:
              item=root/route/'index.html'
              text=item.read_text()
              assert 'ownerAuth' not in text and 'desktopBridge' not in text
              assert 'viewer.css' in text
              assert ('domain-viewer.js' if route in ('romer/','eco/') else 'viewer.js') in text
          combined='\n'.join(x.read_text() for x in files)
          for blocked in ('owner-password','cgx_internal_review_projection','component_geometry_atlas_public_review',
              'localhost:8765','localhost:4173','/api/v1/','/api/owner','NCNB'):
              assert blocked not in combined,blocked
          assert 'PUBLIC_SAFE_SYNTHETIC' in combined
          print('PUBLIC_ISOLATION_AND_ROUTING_PASS')
          PY
      - name: Exercise all routed public viewer interactions in a real browser
        run: |
          python -m pip install -q playwright
          python -m playwright install chromium
          python -m http.server 8179 --bind 127.0.0.1 --directory cgx-isolated-site > /tmp/unispace-static.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          proof={"status":"NOT_RUN","routes":{}}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
              page=browser.new_page(viewport={"width":1024,"height":820})
              errors=[]
              page.on("pageerror",lambda e: errors.append(str(e)))
              for route,heading in (("", "Universal Operating Model"),("fs/","FileSpace"),("ds/","DataSpace"),("ps/","PrintSpace"),("doom/","DOOM benchmark"),("romer/","Römer-Grex"),("eco/","Eco-Grex")):
                  page.goto("http://127.0.0.1:8179/cgx/"+route,wait_until="networkidle",timeout=60000)
                  page.locator("h1").get_by_text(heading).wait_for()
                  proof["routes"][route or "overview"]="PASS"
                  if route=="fs/":
                      page.locator('[data-slice="material"]').click()
                      assert "Value: 4" in page.locator("#prism-out").inner_text()
                  if route=="ds/":
                      page.locator("#resolve").click()
                      assert "LOCAL_VIEW_CANDIDATE" in page.locator("#handshake").inner_text()
                      page.locator("#value").select_option("moving")
                      page.locator("#step").click()
                      assert "Changed fields: 1" in page.locator("#delta").inner_text()
                  if route=="ps/":
                      page.locator("#inert").check()
                      page.locator("#verified").check()
                      page.locator("#evaluate").click()
                      assert "CAN_IF_SIMULATED_CONDITIONS" in page.locator("#process").inner_text()
                      assert "NOT RUN" in page.locator("body").inner_text()
                  if route=="doom/":
                      page.locator("#layer").fill("15")
                      assert "Layer 15/15" in page.locator("#doom-out").inner_text()
              page.set_viewport_size({"width":390,"height":844})
              page.goto("http://127.0.0.1:8179/cgx/",wait_until="networkidle")
              page.screenshot(path="unispace-public-mobile.png",full_page=True)
              proof["mobile_nonoverflow"]=page.evaluate("document.documentElement.scrollWidth <= window.innerWidth+2")
              assert proof["mobile_nonoverflow"]
              for blocked in ("data/cgx_internal_review_projection.json",
                              "data/component_geometry_atlas_public_review.json",
                              "review/cgx_internal_review_projection.json",
                              "ls-go/index.html",
                              "physical-operations-seed.json"):
                  response=page.request.get("http://127.0.0.1:8179/"+blocked)
                  assert response.status==404,(blocked,response.status)
              proof["disallowed_paths_404"]=5
              proof["page_errors"]=errors
              assert not errors, errors
              proof["status"]="PUBLIC_VIEWER_SIMULATION_PASS"
              browser.close()
          Path("unispace-public-browser-proof.json").write_text(json.dumps(proof,indent=2))
          print(json.dumps(proof,indent=2))
          PY
      - name: Preserve public proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unispace-public-viewer-proof
          path: |
            unispace-public-browser-proof.json
            unispace-public-mobile.png
            cgx-public-manifest.json
            cgx-isolated-site/cgx-public-integrity.json
          if-no-files-found: warn
          retention-days: 14
