name: EMC2 Governance Handoff Validation

on:
  pull_request:
    paths:
      - data/governance/emc2_decentralised_handoff_v0_1.json
      - docs/connector-handoff/ACR3_EMC2_DECENTRALISED_SYSTEMS_HANDOFF_2026-09-14.md
      - tests/test_emc2_governance_handoff.py
      - .github/workflows/emc2-governance-handoff-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9

      - name: Validate the bounded governance handoff
        run: python -m unittest tests.test_emc2_governance_handoff -v

      - name: Check the pull-request diff
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
