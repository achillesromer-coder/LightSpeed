name: Luke II Reference Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/luke_ii/**"
      - ".github/workflows/luke-ii-reference-validation.yml"
  push:
    branches: [main]
    paths:
      - "desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/luke_ii/**"
      - ".github/workflows/luke-ii-reference-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luke-ii-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LUKE_DIR: desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/luke_ii

jobs:
  validate:
    name: Regenerate and verify Luke II serviceable reference
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "${{ env.LUKE_DIR }}/requirements.txt"

      - name: Install pinned geometry dependencies
        run: python -m pip install --disable-pip-version-check -r "$LUKE_DIR/requirements.txt"

      - name: Compile executable source
        run: |
          python -m py_compile \
            "$LUKE_DIR/luke_ii_parametric.py" \
            "$LUKE_DIR/luke_ii_geometry_fingerprint.py" \
            "$LUKE_DIR/luke_ii_dimensional_audit.py" \
            "$LUKE_DIR/luke_ii_serviceability_audit.py" \
            "$LUKE_DIR/luke_ii_glb_roundtrip_audit.py" \
            "$LUKE_DIR/luke_ii_interactive.py" \
            "$LUKE_DIR/luke_ii_ci_verify.py" \
            "$LUKE_DIR"/test_luke_ii*.py

      - name: Run 16 geometry, serviceability and audit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v \
            -s "$LUKE_DIR" \
            -p "test_luke_ii*.py" \
            2>&1 | tee "$RUNNER_TEMP/luke-ii-tests.log"

      - name: Regenerate geometry and display-print references
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/luke-ii-output"
          python "$LUKE_DIR/luke_ii_parametric.py" \
            --parameters "$LUKE_DIR/luke_ii_parameters.json" \
            --out-dir "$RUNNER_TEMP/luke-ii-output" \
            | tee "$RUNNER_TEMP/luke-ii-generation.log"

      - name: Generate dimensional register
        shell: bash
        run: |
          set -o pipefail
          python "$LUKE_DIR/luke_ii_dimensional_audit.py" \
            --parameters "$LUKE_DIR/luke_ii_parameters.json" \
            --out-dir "$RUNNER_TEMP/luke-ii-output" \
            | tee "$RUNNER_TEMP/luke-ii-dimensional.log"

      - name: Generate serviceability and print audit
        shell: bash
        run: |
          set -o pipefail
          python "$LUKE_DIR/luke_ii_serviceability_audit.py" \
            --parameters "$LUKE_DIR/luke_ii_parameters.json" \
            --out-dir "$RUNNER_TEMP/luke-ii-output" \
            | tee "$RUNNER_TEMP/luke-ii-serviceability.log"

      - name: Verify exported GLB roundtrip
        shell: bash
        run: |
          set -o pipefail
          python "$LUKE_DIR/luke_ii_glb_roundtrip_audit.py" \
            --parameters "$LUKE_DIR/luke_ii_parameters.json" \
            --glb "$RUNNER_TEMP/luke-ii-output/luke_ii_assembly.glb" \
            --output "$RUNNER_TEMP/luke-ii-output/luke_ii_glb_roundtrip_audit.json" \
            | tee "$RUNNER_TEMP/luke-ii-glb-roundtrip.log"

      - name: Build interactive review surface
        shell: bash
        run: |
          set -o pipefail
          python "$LUKE_DIR/luke_ii_interactive.py" \
            --glb "$RUNNER_TEMP/luke-ii-output/luke_ii_assembly.glb" \
            --manifest "$RUNNER_TEMP/luke-ii-output/luke_ii_component_manifest.json" \
            --parameters "$LUKE_DIR/luke_ii_parameters.json" \
            --verification "$RUNNER_TEMP/luke-ii-output/luke_ii_verification.json" \
            --serviceability "$RUNNER_TEMP/luke-ii-output/luke_ii_serviceability_audit.json" \
            --roundtrip "$RUNNER_TEMP/luke-ii-output/luke_ii_glb_roundtrip_audit.json" \
            --output "$RUNNER_TEMP/luke-ii-output/luke_ii_interactive.html" \
            | tee "$RUNNER_TEMP/luke-ii-interactive.log"

      - name: Verify portable, semantic and maintainability invariants
        shell: bash
        run: |
          set -o pipefail
          python "$LUKE_DIR/luke_ii_ci_verify.py" \
            --source-dir "$LUKE_DIR" \
            --output-dir "$RUNNER_TEMP/luke-ii-output" \
            --receipt-output "$RUNNER_TEMP/luke-ii-ci-receipt.json" \
            | tee "$RUNNER_TEMP/luke-ii-verification.log"

      - name: Upload qualification evidence and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luke-ii-serviceable-reference-validation
          path: |
            ${{ runner.temp }}/luke-ii-tests.log
            ${{ runner.temp }}/luke-ii-generation.log
            ${{ runner.temp }}/luke-ii-dimensional.log
            ${{ runner.temp }}/luke-ii-serviceability.log
            ${{ runner.temp }}/luke-ii-glb-roundtrip.log
            ${{ runner.temp }}/luke-ii-interactive.log
            ${{ runner.temp }}/luke-ii-verification.log
            ${{ runner.temp }}/luke-ii-ci-receipt.json
            ${{ runner.temp }}/luke-ii-output/luke_ii_verification.json
            ${{ runner.temp }}/luke-ii-output/luke_ii_component_manifest.json
            ${{ runner.temp }}/luke-ii-output/luke_ii_dimensional_audit.csv
            ${{ runner.temp }}/luke-ii-output/luke_ii_dimensional_audit_summary.json
            ${{ runner.temp }}/luke-ii-output/luke_ii_serviceability_audit.json
            ${{ runner.temp }}/luke-ii-output/luke_ii_print_segmentation_audit.csv
            ${{ runner.temp }}/luke-ii-output/luke_ii_glb_roundtrip_audit.json
            ${{ env.LUKE_DIR }}/README.md
            ${{ env.LUKE_DIR }}/requirements.txt
            ${{ env.LUKE_DIR }}/luke_ii_parameters.json
            ${{ env.LUKE_DIR }}/luke_ii_parametric.py
            ${{ env.LUKE_DIR }}/luke_ii_geometry_fingerprint.py
            ${{ env.LUKE_DIR }}/luke_ii_dimensional_audit.py
            ${{ env.LUKE_DIR }}/luke_ii_serviceability_audit.py
            ${{ env.LUKE_DIR }}/luke_ii_glb_roundtrip_audit.py
            ${{ env.LUKE_DIR }}/luke_ii_interactive.py
            ${{ env.LUKE_DIR }}/luke_ii_ci_verify.py
            ${{ env.LUKE_DIR }}/luke_ii_execution_receipt.json
            ${{ env.LUKE_DIR }}/upstream_source_register.json
            ${{ env.LUKE_DIR }}/test_luke_ii_parametric.py
            ${{ env.LUKE_DIR }}/test_luke_ii_dimensional_audit.py
            ${{ env.LUKE_DIR }}/test_luke_ii_serviceability_audit.py
            ${{ env.LUKE_DIR }}/test_luke_ii_glb_roundtrip_audit.py
            .github/workflows/luke-ii-reference-validation.yml
          if-no-files-found: warn
          retention-days: 30
