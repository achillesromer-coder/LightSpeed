name: Luke II Reference Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/luke_ii/**"
      - ".github/workflows/luke-ii-reference-validation.yml"
  push:
    branches:
      - main
    paths:
      - "desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/luke_ii/**"
      - ".github/workflows/luke-ii-reference-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luke-ii-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LUKE_DIR: desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/luke_ii

jobs:
  validate:
    name: Regenerate and verify Luke II reference geometry
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "${{ env.LUKE_DIR }}/requirements.txt"

      - name: Install pinned geometry dependencies
        run: python -m pip install --disable-pip-version-check -r "$LUKE_DIR/requirements.txt"

      - name: Compile executable source
        run: |
          python -m py_compile \
            "$LUKE_DIR/luke_ii_parametric.py" \
            "$LUKE_DIR/luke_ii_geometry_fingerprint.py" \
            "$LUKE_DIR/luke_ii_dimensional_audit.py" \
            "$LUKE_DIR/test_luke_ii_parametric.py" \
            "$LUKE_DIR/test_luke_ii_dimensional_audit.py"

      - name: Run geometry, evidence and audit tests
        run: |
          set -o pipefail
          python -m unittest discover -v \
            -s "$LUKE_DIR" \
            -p "test_luke_ii*.py" \
            2>&1 | tee "$RUNNER_TEMP/luke-ii-tests.log"

      - name: Regenerate deterministic geometry outputs
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/luke-ii-output"
          python "$LUKE_DIR/luke_ii_parametric.py" \
            --parameters "$LUKE_DIR/luke_ii_parameters.json" \
            --out-dir "$RUNNER_TEMP/luke-ii-output" \
            | tee "$RUNNER_TEMP/luke-ii-generation.log"

      - name: Generate dimensional engineering-review register
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/luke-ii-audit"
          python "$LUKE_DIR/luke_ii_dimensional_audit.py" \
            --parameters "$LUKE_DIR/luke_ii_parameters.json" \
            --out-dir "$RUNNER_TEMP/luke-ii-audit" \
            | tee "$RUNNER_TEMP/luke-ii-audit.log"

      - name: Verify source, portable artifacts and semantic geometry
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["LUKE_DIR"])
          output = Path(os.environ["RUNNER_TEMP"]) / "luke-ii-output"
          audit_dir = Path(os.environ["RUNNER_TEMP"]) / "luke-ii-audit"
          receipt = json.loads((source / "luke_ii_execution_receipt.json").read_text(encoding="utf-8"))
          verification = json.loads((output / "luke_ii_verification.json").read_text(encoding="utf-8"))
          audit = json.loads((audit_dir / "luke_ii_dimensional_audit_summary.json").read_text(encoding="utf-8"))

          def sha256(path: Path) -> str:
              if not path.is_file():
                  raise SystemExit(f"Missing required artifact: {path.name}")
              return hashlib.sha256(path.read_bytes()).hexdigest()

          parameters_path = source / "luke_ii_parameters.json"
          glb_path = output / "luke_ii_assembly.glb"
          stl_path = output / "luke_ii_reference_1to100.stl"
          verification_path = output / "luke_ii_verification.json"
          audit_csv = audit_dir / "luke_ii_dimensional_audit.csv"
          audit_summary = audit_dir / "luke_ii_dimensional_audit_summary.json"

          expected_parameters = receipt["canonical_source"]["parameters_sha256"]
          expected_stl = receipt["generated_artifacts"]["stl"]["sha256"]
          expected_audit_csv = receipt["dimensional_audit"]["csv_sha256"]
          expected_semantic = receipt["geometry_verification"]["semantic_geometry_sha256"]

          observed = {
              "parameters": sha256(parameters_path),
              "assembly_glb_build_receipt": sha256(glb_path),
              "print_shell_stl": sha256(stl_path),
              "verification_build_receipt": sha256(verification_path),
              "dimensional_audit_csv": sha256(audit_csv),
              "dimensional_audit_summary": sha256(audit_summary),
          }

          if observed["parameters"] != expected_parameters:
              raise SystemExit("Canonical parameter bytes changed without receipt update")
          if observed["print_shell_stl"] != expected_stl:
              raise SystemExit("Portable STL hash does not match the execution receipt")
          if observed["dimensional_audit_csv"] != expected_audit_csv:
              raise SystemExit("Dimensional-audit CSV hash does not match the execution receipt")
          if audit["semantic_geometry_sha256"] != expected_semantic:
              raise SystemExit("Semantic geometry fingerprint does not match the execution receipt")

          geometry = receipt["geometry_verification"]
          if verification["status"] != "PASS_REFERENCE_GEOMETRY":
              raise SystemExit(f"Unexpected verification status: {verification['status']}")
          checks = verification["geometry_checks"]
          named_nodes = verification["scene"]["geometry_nodes"]
          watertight_nodes = sum(1 for check in checks.values() if check["watertight"])
          winding_consistent_nodes = sum(1 for check in checks.values() if check["winding_consistent"])
          if named_nodes != geometry["named_nodes"]:
              raise SystemExit("Named geometry-node count does not match the execution receipt")
          if watertight_nodes != geometry["individual_nodes_watertight"]:
              raise SystemExit("Watertight-node count does not match the execution receipt")
          if winding_consistent_nodes != geometry["individual_nodes_winding_consistent"]:
              raise SystemExit("Winding-consistent-node count does not match the execution receipt")
          if verification["print_shell"]["watertight"] is not True:
              raise SystemExit("Printable reference shell is not watertight")

          if audit["status"] != "PASS_DIMENSIONAL_REFERENCE_AUDIT":
              raise SystemExit(f"Unexpected dimensional-audit status: {audit['status']}")
          if audit["node_count"] != named_nodes:
              raise SystemExit("Dimensional-audit node count does not match regenerated geometry")
          if not audit["all_nodes_watertight"] or not audit["all_nodes_winding_consistent"]:
              raise SystemExit("Dimensional-audit mesh-quality gate failed")
          if audit["evidence_state_counts"].get("ILLUSTRATIVE_ONLY_NOT_PHYSICAL_FIELD") != 3:
              raise SystemExit("Field-guide claim classification changed unexpectedly")
          if audit["evidence_state_counts"].get("ILLUSTRATIVE_SEQUENCE_ONLY") != 4:
              raise SystemExit("Payload-sequence claim classification changed unexpectedly")
          if audit["csv_sha256"] != observed["dimensional_audit_csv"]:
              raise SystemExit("Dimensional-audit CSV hash does not match its summary")

          result = {
              "schema_version": "luke-ii-ci-receipt-v1",
              "status": "PASS_PORTABLE_AND_SEMANTIC_REGENERATION",
              "source_branch": os.environ.get("GITHUB_HEAD_REF") or os.environ.get("GITHUB_REF_NAME"),
              "commit": os.environ.get("GITHUB_SHA"),
              "observed_sha256": observed,
              "semantic_geometry_sha256": audit["semantic_geometry_sha256"],
              "semantic_geometry_quantization_m": audit["semantic_geometry_quantization_m"],
              "geometry_nodes": named_nodes,
              "raw_glb_hash_policy": "BUILD_RECEIPT_ONLY_NOT_CROSS_PLATFORM_ACCEPTANCE_GATE",
              "raw_verification_hash_policy": "BUILD_RECEIPT_ONLY_INCLUDES_OBSERVED_GLB_HASH",
              "claim_gate_state": "UNCHANGED",
          }
          result_path = Path(os.environ["RUNNER_TEMP"]) / "luke-ii-ci-receipt.json"
          result_path.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          PY

      - name: Upload deterministic validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luke-ii-reference-validation
          path: |
            ${{ runner.temp }}/luke-ii-tests.log
            ${{ runner.temp }}/luke-ii-generation.log
            ${{ runner.temp }}/luke-ii-audit.log
            ${{ runner.temp }}/luke-ii-ci-receipt.json
            ${{ runner.temp }}/luke-ii-output/luke_ii_verification.json
            ${{ runner.temp }}/luke-ii-audit/luke_ii_dimensional_audit.csv
            ${{ runner.temp }}/luke-ii-audit/luke_ii_dimensional_audit_summary.json
          if-no-files-found: warn
          retention-days: 30
