name: CGX Native Web MCP Safety
on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/LightSpeed_Runtime/mcp/cgx_tools/**"
      - ".github/workflows/cgx-native-web-mcp.yml"
      - "desktop/LightSpeed_Runtime/lightspeed_runtime/node_exchange.py"
      - "desktop/LightSpeed_Runtime/tests/test_node_exchange.py"
  push:
    branches:
      - "cgx/dataspace-rolling-observer-facet-20261012"
    paths:
      - "desktop/LightSpeed_Runtime/mcp/cgx_tools/**"
      - "tools/run_cgx_web_readonly_mcp.mjs"
      - "tools/setup_cgx_web_tunnel.ps1"
      - ".github/workflows/cgx-native-web-mcp.yml"
      - "desktop/LightSpeed_Runtime/lightspeed_runtime/node_exchange.py"
      - "desktop/LightSpeed_Runtime/tests/test_node_exchange.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgx-web-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded_web_entry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install pinned CGX MCP runtime dependencies
        working-directory: desktop/LightSpeed_Runtime/mcp/cgx_tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse setup PowerShell without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/setup_cgx_web_tunnel.ps1'),
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            foreach ($parseError in $errors) {
              Write-Host ("PARSE_ERROR line={0} col={1} msg={2}" -f
                $parseError.Extent.StartLineNumber,
                $parseError.Extent.StartColumnNumber,
                $parseError.Message)
            }
            throw "PowerShell source parse failed"
          }
      - name: Validate web tool exposure and negative privileges
        working-directory: desktop/LightSpeed_Runtime/mcp/cgx_tools
        env:
          CGX_MCP_EXPOSURE: web-readonly
        run: |
          node --check server.mjs
          npm run test:web

peer_claims_source_review:
    name: Refuse unsupported peer attestation
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify discovered nodes never self-attest
        env:
          PYTHONPATH: desktop/LightSpeed_Runtime
        run: |
          python - <<'PY'
          from lightspeed_runtime.node_exchange import build_exchange_status
          for nodes in ([], ["peer-b"], ["peer-b", "peer-c"], ["bouwerbase"]):
              for root_ready in (False, True):
                  status = build_exchange_status(
                      local_node_id="bouwerbase",
                      local_compute_ready=True,
                      peer_nodes=nodes,
                      verified_carriers=["local-volume"],
                      host_root_registry_ready=root_ready,
                  )
                  assert status["compute"]["peer_nodes"] == nodes
                  assert status["transport"]["peer_transport_verified"] is False
                  assert status["compute"]["peer_compute_verified"] is False
                  assert status["activation"]["peer_compute_queue_ready"] is False
                  assert status["activation"]["host_root_registry_ready"] is root_ready
                  assert status["canonical_promotion_authorized"] is False
                  assert status["authority_transfer"] is False
          print("PASS: eight identity-only peer scenarios fail closed")
          PY
