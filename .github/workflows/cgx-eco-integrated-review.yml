name: CGX Eco integrated review slice
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cgx/domain_templates/eco_review_cascade*.mjs'
      - 'cgx/domain_templates/eco_pre_mint_assembly*.mjs'
      - 'cgx/domain_templates/eco_qualified_alignment.mjs'
      - 'cgx/domain_templates/eco_qualified_alignment.test.mjs'
      - 'cgx/domain_templates/eco_second_cycle_claim_review.mjs'
      - 'cgx/domain_templates/eco_bioblock_monitoring_review.mjs'
      - 'cgx/domain_templates/eco_bioblock_monitoring_review.test.mjs'
      - '.github/workflows/cgx-eco-integrated-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eco-review-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute integrated Eco source-to-review and negative gates
        run: node --test cgx/domain_templates/eco_review_cascade.test.mjs cgx/domain_templates/eco_bioblock_monitoring_review.test.mjs cgx/domain_templates/eco_pre_mint_assembly.test.mjs cgx/domain_templates/eco_qualified_alignment.test.mjs
