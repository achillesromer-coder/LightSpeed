name: Expand Mark III v0.2 Source

on:
  push:
    branches:
      - execution/mark-iii-serviceable-reference-2026-08-05
    paths:
      - "desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/mark_iii/mark_iii_v0_2_source_bundle_parts/**"
      - ".github/workflows/mark-iii-expand-v0-2.yml"
  pull_request:
    branches:
      - execution/luke-ii-parametric-reference-2026-08-04
    paths:
      - "desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/mark_iii/mark_iii_v0_2_source_bundle_parts/**"
      - ".github/workflows/mark-iii-expand-v0-2.yml"

permissions:
  contents: write

concurrency:
  group: mark-iii-v0-2-source-expansion
  cancel-in-progress: false

env:
  MARK_DIR: desktop/Desktop_Hooks/LightSpeed/Z Axis/Z0_TheConstruct/orbital/mark_iii
  BUNDLE_SHA256: 4fe060f269b7dedcf424d53713d3bd9b8c0cbb3ed821cf5347f06a64669a7605
  TARGET_BRANCH: execution/mark-iii-serviceable-reference-2026-08-05

jobs:
  expand:
    name: Materialise qualified Mark III v0.2 source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Reassemble and expand deterministic source bundle
        id: materialise
        shell: bash
        run: |
          set -euo pipefail
          parts="$MARK_DIR/mark_iii_v0_2_source_bundle_parts"
          if ! compgen -G "$parts/part_*" > /dev/null; then
            echo "expanded=false" >> "$GITHUB_OUTPUT"
            echo "Source bundle already materialised; nothing to do."
            exit 0
          fi
          bundle="$RUNNER_TEMP/mark-iii-v0-2-source.zip"
          staging="$RUNNER_TEMP/mark-iii-v0-2-source"
          cat "$parts"/part_* > "$bundle"
          echo "$BUNDLE_SHA256  $bundle" | sha256sum -c -
          mkdir -p "$staging" "$MARK_DIR"
          unzip -q "$bundle" -d "$staging"
          cp -f "$staging"/source/* "$MARK_DIR"/
          rm -rf "$parts"
          echo "expanded=true" >> "$GITHUB_OUTPUT"

      - name: Commit full readable source
        if: steps.materialise.outputs.expanded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$MARK_DIR"
          git diff --cached --check
          git commit -m "Materialise Mark III v0.2 serviceable reference source"
          git push origin HEAD:"$TARGET_BRANCH"
