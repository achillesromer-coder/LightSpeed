name: Alexandria indexed libraries and public asset safety review
on:
  pull_request:
    paths:
      - "cgx/review/alexandria_curated_upstream_tools_20261020.json"
      - "cgx/review/alexandria_official_reference_roots_20261020.json"
      - "cgx/review/alexandria_foundation_learning_modules_v0_1.json"
      - "cgx/review/alexandria_library_projection.py"
      - "cgx/review/unispace_public_asset_boundary.py"
      - "tests/test_cgx_alexandria_library_security_convergence.py"
      - "cgx/review/alexandria_offline_reference_preview.py"
      - "tests/test_cgx_alexandria_offline_reference_preview.py"
      - ".github/workflows/cgx-alexandria-library-public-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-library-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate additive catalogue
        run: |
          python -m json.tool cgx/review/alexandria_curated_upstream_tools_20261020.json > /dev/null
          python -m json.tool cgx/review/alexandria_official_reference_roots_20261020.json > /dev/null
          python -m json.tool cgx/review/alexandria_foundation_learning_modules_v0_1.json > /dev/null
      - name: Test rights-held cross-domain references and static privacy safeguards
        run: |
          python -m unittest discover -s tests -p 'test_cgx_alexandria_library_security_convergence.py' -v
          python -m unittest discover -s tests -p 'test_cgx_alexandria_offline_reference_preview.py' -v
      - name: Produce deterministic source-only coverage projection
        run: |
          python cgx/review/alexandria_library_projection.py > /tmp/cgx_alexandria_discovery_only.json
          python -m json.tool /tmp/cgx_alexandria_discovery_only.json > /dev/null
      - name: Generate purely offline source-reference preview into temporary workspace
        run: |
          python cgx/review/alexandria_offline_reference_preview.py --output /tmp/alexandria_offline_reference_candidate.html
          test -s /tmp/alexandria_offline_reference_candidate.html
          ! grep -q '<script src=' /tmp/alexandria_offline_reference_candidate.html
      - name: Audit current Vite public paths but do not infer release clearance
        run: |
          python cgx/review/unispace_public_asset_boundary.py > /tmp/cgx_internal_static_risk_report.json
          python -m json.tool /tmp/cgx_internal_static_risk_report.json > /dev/null
          python - <<'PY'
          import json
          j=json.load(open('/tmp/cgx_internal_static_risk_report.json'))
          assert j['release_authorised'] is False
          print('Known internal-static risk paths:',j['known_internal_static_file_count'])
          print('Gate state:',j['state'])
          PY
      - name: Keep source-only Alexandria candidate as an owner-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: alexandria-offline-review
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/alexandria_offline_reference_candidate.html
            /tmp/cgx_alexandria_discovery_only.json
            /tmp/cgx_internal_static_risk_report.json
