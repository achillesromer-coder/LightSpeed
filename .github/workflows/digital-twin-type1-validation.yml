name: Digital Twin and Type 1 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "assets/models/**"
      - "assets/previews/**"
      - "assets/type1-svg/**"
      - "data/digital-twin/**"
      - "docs/digital-twin/**"
      - "tools/digital-twin/**"
      - "tests/test_digital_twin_assets.py"
      - ".github/workflows/digital-twin-type1-validation.yml"
  push:
    branches: [main, "review/**"]
    paths:
      - "assets/models/**"
      - "assets/previews/**"
      - "assets/type1-svg/**"
      - "data/digital-twin/**"
      - "docs/digital-twin/**"
      - "tools/digital-twin/**"
      - "tests/test_digital_twin_assets.py"
      - ".github/workflows/digital-twin-type1-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-twin-type1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Reproduce and validate review assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned geometry dependencies
        run: python -m pip install -r tools/digital-twin/requirements.txt pytest==8.3.5
      - name: Validate deterministic assets and Type 1 boundary
        run: python -m pytest -q tests/test_digital_twin_assets.py
      - name: Reject whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
