name: GST-063 Route Contract

on:
  pull_request:
    paths:
      - 'desktop/LightSpeed_Runtime/lightspeed_runtime/web_integration.py'
      - 'desktop/Desktop_Hooks/LightSpeed/config/web_drive_bridge.json'
      - 'desktop/Desktop_Hooks/LightSpeed/tests/test_runtime_package.py'
      - 'desktop/Desktop_Hooks/LightSpeed/tests/test_gst063_route_contract.py'
      - 'desktop/Desktop_Hooks/LightSpeed/tests/test_gst063_route_semantics.py'
      - 'desktop/Desktop_Hooks/LightSpeed/tools/regenerate_gst063_web_bridge.py'
      - '.github/workflows/gst063-route-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route-contract:
    name: Enforce GST-063 route contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Generate canonical bridge candidate
        env:
          PYTHONPATH: desktop/LightSpeed_Runtime
        run: python desktop/Desktop_Hooks/LightSpeed/tools/regenerate_gst063_web_bridge.py

      - name: Execute GST-063 regression gate against generated candidate
        env:
          PYTHONPATH: desktop/LightSpeed_Runtime
        run: >-
          python -m pytest -q
          desktop/Desktop_Hooks/LightSpeed/tests/test_gst063_route_contract.py
          desktop/Desktop_Hooks/LightSpeed/tests/test_gst063_route_semantics.py

      - name: Upload canonical bridge candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst063-web-drive-bridge-candidate
          path: desktop/Desktop_Hooks/LightSpeed/config/web_drive_bridge.json
          if-no-files-found: error
          retention-days: 7

      - name: Apply generated bridge only on bounded PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/gst063-route-registry-2026-09-06'
        run: |
          if git diff --quiet -- desktop/Desktop_Hooks/LightSpeed/config/web_drive_bridge.json; then
            echo "Generated bridge already matches canonical source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/Desktop_Hooks/LightSpeed/config/web_drive_bridge.json
          git commit -m "chore(gst063): regenerate web drive bridge"
          git push origin HEAD:${{ github.head_ref }}

      - name: Enforce clean generated parity
        run: git diff --exit-code -- desktop/Desktop_Hooks/LightSpeed/config/web_drive_bridge.json
