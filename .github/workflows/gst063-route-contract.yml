name: GST-063 Route Contract
# Final same-head validation trigger after one-shot legacy semantic migration.
# Final manifest-sync validation trigger; no runtime/source semantics changed.

on:
  pull_request:
    paths:
      - 'desktop/LightSpeed_Runtime/lightspeed_runtime/web_integration.py'
      - 'desktop/Desktop_Hooks/LightSpeed/config/web_drive_bridge.json'
      - 'desktop/Desktop_Hooks/LightSpeed/tests/test_runtime_package.py'
      - 'desktop/Desktop_Hooks/LightSpeed/tests/test_gst063_route_contract.py'
      - 'desktop/Desktop_Hooks/LightSpeed/tests/test_gst063_route_semantics.py'
      - 'desktop/Desktop_Hooks/LightSpeed/tools/regenerate_gst063_web_bridge.py'
      - '.github/workflows/gst063-route-contract.yml'
  push:
    branches:
      - 'fix/gst063-route-registry-2026-09-06'
    paths:
      - '.github/workflows/gst063-route-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-contract:
    name: Enforce GST-063 route contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Verify committed bridge matches canonical generator
        env:
          PYTHONPATH: desktop/LightSpeed_Runtime
        run: python desktop/Desktop_Hooks/LightSpeed/tools/regenerate_gst063_web_bridge.py --check

      - name: Execute GST-063 route and bridge semantic regressions
        env:
          PYTHONPATH: desktop/LightSpeed_Runtime
        run: >-
          python -m pytest -q
          desktop/Desktop_Hooks/LightSpeed/tests/test_gst063_route_contract.py
          desktop/Desktop_Hooks/LightSpeed/tests/test_gst063_route_semantics.py
