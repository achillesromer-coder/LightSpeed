name: CGX assurance and custodial validation

on:
  push:
    paths:
      - "cgx/domain_templates/**"
      - "scripts/resolve_cgx_extensions.py"
      - "scripts/cgx_custodial_preflight.py"
      - "scripts/validate_cgp_ies_extension.py"
      - "scripts/validate_cgp_ies_launch_frontier.py"
      - "scripts/validate_cgx_domain_templates.py"
      - "scripts/classify_provider_notification.py"
      - "tests/test_provider_notification_evidence.py"
      - "scripts/validate_cgx_execution_lease.py"
      - "scripts/build_cgp_ies_parent_candidate.py"
      - "scripts/build_cgx_domain_children.py"
      - "scripts/migrate_first_file_semantics_to_s92.py"
      - "scripts/validate_cgx_preflight_chain.py"
      - "scripts/cgx_consequence_preflight.py"
      - "scripts/validate_cgx_assurance.py"
      - "scripts/cgx_assurance_preflight.py"
      - "scripts/cgx_assurance_route.py"
      - "cgx/domain_templates/mpl_assurance_adapter.json"
      - "cgx/domain_templates/assurance_relation_registry.json"
      - "cgx/domain_templates/assurance_case_contract.json"
      - "cgx/domain_templates/agentic_security_threat_registry.json"
      - "cgx/domain_templates/execution_lease_contract.json"
      - "scripts/run_cgx_agent_runtime.py"
      - "scripts/validate_cgx_execution_lease.py"
      - "scripts/build_cgp_ies_parent_candidate.py"
      - ".github/workflows/cgx-custodial-extension-validation.yml"
  pull_request:
    paths:
      - "cgx/domain_templates/**"
      - "scripts/resolve_cgx_extensions.py"
      - "scripts/cgx_custodial_preflight.py"
      - "scripts/validate_cgp_ies_extension.py"
      - "scripts/validate_cgx_domain_templates.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CGX templates
        run: python scripts/validate_cgx_domain_templates.py
      - name: Validate provider notification evidence classifier
        run: python -m pytest -q tests/test_provider_notification_evidence.py
      - name: Validate CGP-IES extension fixtures
        run: python scripts/validate_cgp_ies_extension.py
      - name: Validate CGP-IES operational queue
        run: python scripts/validate_cgp_ies_launch_frontier.py
      - name: Compile guarded parent candidate builder
        run: python -m py_compile scripts/build_cgp_ies_parent_candidate.py
      - name: Package CGP-IES parent source bundle
        run: |
          mkdir -p /tmp/cgp-ies-source/cgx/domain_templates /tmp/cgp-ies-source/scripts
          cp scripts/build_cgp_ies_parent_candidate.py /tmp/cgp-ies-source/scripts/
          cp cgx/domain_templates/custodial_extension_registry.json /tmp/cgp-ies-source/cgx/domain_templates/
          cp cgx/domain_templates/cgp_ies_policy_pack.json /tmp/cgp-ies-source/cgx/domain_templates/
          cp cgx/domain_templates/cgp_ies_terminology_map.json /tmp/cgp-ies-source/cgx/domain_templates/
          cp cgx/domain_templates/cgp_ies_domain_adapter_registry.json /tmp/cgp-ies-source/cgx/domain_templates/
          cp cgx/domain_templates/cgp_ies_decision_receipt_schema.json /tmp/cgp-ies-source/cgx/domain_templates/
          cp cgx/domain_templates/cgp_ies_fixture_scenarios.json /tmp/cgp-ies-source/cgx/domain_templates/
          cp cgx/domain_templates/cgp_ies_owner_confirmation_values.json /tmp/cgp-ies-source/cgx/domain_templates/
          cp cgx/domain_templates/cgp_ies_authority_phase_ref.json /tmp/cgp-ies-source/cgx/domain_templates/
          cp cgx/domain_templates/cgp_ies_release_visibility_policy.json /tmp/cgp-ies-source/cgx/domain_templates/
          cp cgx/domain_templates/cgp_ies_object_envelope_schema.json /tmp/cgp-ies-source/cgx/domain_templates/
          cp cgx/domain_templates/cgp_ies_parent_extension_manifest.json /tmp/cgp-ies-source/cgx/domain_templates/
      - uses: actions/upload-artifact@v4
        with:
          name: cgp-ies-parent-source
          path: /tmp/cgp-ies-source
          if-no-files-found: error
          retention-days: 7
      - name: Package S92 domain-child builder source
        run: |
          mkdir -p /tmp/cgx-s92-child-source/cgx /tmp/cgx-s92-child-source/scripts
          cp -R cgx/domain_templates /tmp/cgx-s92-child-source/cgx/
          cp scripts/build_cgx_domain_children.py /tmp/cgx-s92-child-source/scripts/
          cp scripts/migrate_first_file_semantics_to_s92.py /tmp/cgx-s92-child-source/scripts/
      - uses: actions/upload-artifact@v4
        with:
          name: cgx-s92-domain-child-source
          path: /tmp/cgx-s92-child-source
          if-no-files-found: error
          retention-days: 7
      - name: Validate CGX assurance fixtures
        run: python scripts/validate_cgx_assurance.py
      - name: Validate consequence preflight chain
        run: python scripts/validate_cgx_preflight_chain.py
      - name: Validate execution lease authority and release gates
        run: python scripts/validate_cgx_execution_lease.py
      - name: Route InterSol assurance scenario
        run: python scripts/cgx_assurance_route.py --domain romer --execution-depth build --cascade-class C2 --tags intersol,facility,battery-room,public-route
      - name: Resolve observational scenario
        run: python scripts/resolve_cgx_extensions.py --domain eco --execution-depth inspect --cascade-class C1 --tags field-observation

      - name: Validate guarded runtime low-consequence preflight
        run: python scripts/run_cgx_agent_runtime.py --preflight-only --instruction "Inspect a bounded runtime status receipt" --domain lightspeed --execution-depth inspect --cascade-class C0 --tags runtime-read
      - name: Verify unclassified C2 execution holds
        shell: bash
        run: |
          set +e
          python scripts/run_cgx_agent_runtime.py --preflight-only --instruction "Execute a consequential operation" --domain romer --execution-depth execute --cascade-class C2
          code=$?
          test "$code" -eq 3
