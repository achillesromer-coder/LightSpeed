<g id="L70-INTERFACES" data-layer="L70-INTERFACES">
<text x="1072" y="710" class="section-title">INTERFACE STATE</text>
<text x="1072" y="732" class="body">Critical physical, electrical, structural, fluid, control and</text>
<text x="1072" y="750" class="body">ecological interfaces remain evidence-gated; no connection</text>
<text x="1072" y="768" class="body">capacity is inferred from geometry.</text>
</g>
<g id="L75-SENSORS" data-layer="L75-SENSORS">
<text x="48" y="808" class="section-title">TELEMETRY STATE</text>
<text x="48" y="830" class="body">No LIVE state is asserted. Sensor identity, physical location, calibration, raw</text>
<text x="48" y="848" class="body">dataset hash, uncertainty and last-valid observation remain required.</text>
</g>
<g id="L80-SIMULATION" data-layer="L80-SIMULATION">
<text x="820" y="808" class="section-title">SIMULATION STATE</text>
<text x="820" y="830" class="body">No solver result or measured performance is promoted by this projection. Reproducible</text>
<text x="820" y="848" class="body">inputs, boundary conditions, solver version, residuals and output hashes remain</text>
<text x="820" y="866" class="body">required.</text>
</g>
