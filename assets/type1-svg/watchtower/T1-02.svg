<text x="820" y="848" class="body">inputs, boundary conditions, solver version, residuals and output hashes remain</text>
<text x="820" y="866" class="body">required.</text>
</g>
<g id="L90-EVIDENCE" data-layer="L90-EVIDENCE">
<text x="440" y="130" class="section-title">EVIDENCE CLASS</text>
<text x="440" y="152" class="body">SOURCE_DERIVED_GEOMETRY. Source mesh hash is</text>
<text x="440" y="170" class="body">bound. Current migration priority P0 and fidelity</text>
<text x="440" y="188" class="body">F3.</text>
</g>
