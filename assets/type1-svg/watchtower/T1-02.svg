<text x="1160" y="130" class="section-title">SHEET LIMIT</text>
<text x="1160" y="152" class="body">This is a machine-addressable review projection.</text>
<text x="1160" y="170" class="body">Blank or gated domains are deliberate and must not</text>
<text x="1160" y="188" class="body">be aesthetically filled with invented values.</text>
