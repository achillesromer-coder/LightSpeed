<text x="48" y="808" class="section-title">TELEMETRY STATE</text>
<text x="48" y="830" class="body">No LIVE state is asserted. Sensor identity, physical location, calibration, raw</text>
<text x="48" y="848" class="body">dataset hash, uncertainty and last-valid observation remain required.</text>
