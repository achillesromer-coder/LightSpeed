async function loadDB(){try{db=await new Promise((ok,bad)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('objects',{keyPath:'id'});d.createObjectStore('blobs')};r.onerror=()=>bad(r.error);r.onsuccess=()=>ok(r.result)});state.records=await txAll();let v=localStorage.getItem('cgx-filespace-profile');state.profile=v||''}catch(err){state.memOnly=true;db=null;state.records=[];setStatus('Storage unavailable; session-only mode. Export snapshots before closing.')}}

function blobKey(rec){return 'sha256:'+rec.sha256}
async function occurrenceId(path,sourceSHA,profile){return 'occurrence:'+await sha(new TextEncoder().encode(String(profile||'local-owner')+'\0'+String(path)+'\0'+String(sourceSHA)))}
function setStatus(s){$('status').textContent=s}
function size(n){return (n/1048576).toFixed(2)+' MiB'}
function dl(obj,name){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}

async function sha(b){if(crypto?.subtle){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('')}return sha256Fallback(b)}
function meta(rec){return `${e(rec.type)} · ${size(rec.bytes)} · ${rec.status==='shredded'?'Reversible tombstone':'Review'}`}
async function importFiles(files){let existing=state.records.filter(x=>x.status==='live'),used=existing.reduce((a,b)=>a+b.bytes,0),accepted=0,errors=[];if(files.length>MAX_FILES){setStatus('File count exceeds 250 source budget');return}

function list(rows){return rows.length?`<div class="list">${rows.slice(0,250).map(r=>`<div class="item ${r.status==='shredded'?'deleted':''}"><div><button data-select="${e(r.id)}">${e(r.name)}</button><div class="meta">${meta(r)}</div></div>${r.status==='shredded'?`<button data-restore="${e(r.id)}">Restore</button>`:`<button data-shred="${e(r.id)}">Shred ↻</button>`}</div>`).join('')}</div>`:'<p class="muted">No records in this namespace.</p>'}
function shell(){let r=state.records,live=r.filter(x=>x.status==='live'),shredded=r.filter(x=>x.status==='shredded'),sel=r.find(x=>x.id===state.selected);
 let s=`<div class="eyebrow">CGX local handshake · user controlled</div>`;
 if(state.tab==='setup')s+=`<section class="hero"><h2>Bring a device into UniSpace.</h2><p>A blank, private, browser-openable workspace. The first handshake is local and does not contact external servers. Set a pseudonym, choose what to copy into this browser, and export a portable source-bound review snapshot.</p></section><div class="cards"><div class="card" data-tab="setup"><strong>01 · ProfileSpace</strong><p>Pseudonymous identity and scope. Not a signed native CGX credential.</p></div><div class="card" data-tab="files"><strong>02 · FileSpace</strong><p>Drag files and folders, inspect bytes, build exact SHA-256 references.</p></div><div class="card" data-tab="connect"><strong>03 · DataSpace + LOAD</strong><p>Plan an authenticated handoff only after canonical LOAD and peer leases are qualified.</p></div></div><div class="paper"><strong>Startup requirements</strong><p class="muted">Chrome/Chromium or equivalent modern browser. IndexedDB availability and available storage vary by origin and device. Full LOAD is a required existing canonical capability, not LOAD.Lite and not bundled as an impersonating mock.</p><button data-tab="files">Begin FileSpace intake</button></div>`;
 if(state.tab==='files')s+=`<h2>FileSpace · local sources</h2><p class="muted">The object structure derives from actual source bytes and optional facets. No arbitrary geometric interpretation or automatic network upload.</p><div class="drop" id="drop"><div><strong>Drop a file or folder</strong><p class="muted">Or choose sources explicitly. Maximum 250 files, 48 MiB each, 192 MiB per review import.</p><button id="pick">Choose files</button> <button id="pickFolder">Choose folder</button><input id="pickInput" type="file" multiple hidden><input id="folderInput" type="file" webkitdirectory multiple hidden></div></div><div class="row"><span class="tag">${live.length} source occurrences</span><span class="tag">${new Set(live.map(x=>x.sha256)).size} unique payloads</span><span class="tag">${size(live.reduce((a,b)=>a+b.bytes,0))} indexed</span><span class="tag">${state.memOnly?'Session only':'IndexedDB'}</span></div>${list(live)}`;
 if(state.tab==='shred')s+=`<h2>Reversible shredder</h2><p class="muted">Shred creates a tombstone in the private namespace; the original record and copied source bytes are preserved for restoration. Permanent deletion is intentionally not automatic.</p>${list(shredded)}<div class="info">Native trash/recycle-bin integration, native shell extensions and network revocation require separate OS authorisation.</div>`;
 if(state.tab==='inspect')s+=`<h2>Inspect and resolve</h2>${sel?`<section class="paper"><h3>${e(sel.name)}</h3><div class="receipt">${e(JSON.stringify(sel,null,2))}</div><div class="row"><button data-view="2D" class="${state.view==='2D'?'active':''}">2D</button><button data-view="2.5D" class="${state.view==='2.5D'?'active':''}">2.5D · illustrative</button><button data-view="3D" class="${state.view==='3D'?'active':''}">3D · source mesh</button><button id="downloadSelected">Recover original</button></div><div class="preview" id="preview">Preview resolves after explicit selection</div></section>`:'<p class="muted">Select a source in FileSpace.</p>'}<div class="info">Photographs do not acquire measured depth through a 2.5D effect. Only recognised OBJ geometry with actual vertices and faces receives a three-dimensional mesh preview.</div>`;

}
async function preview(){let out=$('preview'),rec=state.records.find(x=>x.id===state.selected);if(!out||!rec)return;let blob=await getBlob(blobKey(rec))||await getBlob(rec.id);if(!blob){out.textContent='Source bytes absent; metadata reference only. Rehydrate from the original owner-controlled source.';return}if(imageURL){URL.revokeObjectURL(imageURL);imageURL=null}
 if(rec.type==='image'){imageURL=URL.createObjectURL(blob);out.innerHTML=`<img alt="Locally selected image" src="${imageURL}">`;if(state.view==='2.5D')out.style.transform='perspective(900px) rotateY(-6deg)';else out.style.transform='none';if(state.view==='3D')out.insertAdjacentHTML('beforeend','<div class="tag" style="position:absolute;bottom:7px">No measured depth; 2D original</div>');return}

 if(rec.type==='geometry'&&rec.name.toLowerCase().endsWith('.obj')){let src=await blob.slice(0,4000000).text(),verts=[],faces=[];for(let l of src.split(/\r?\n/)){let p=l.trim().split(/\s+/),n=p.shift();if(n==='v'&&verts.length<20000){let q=p.slice(0,3).map(Number);if(q.length===3&&q.every(Number.isFinite))verts.push(q)}if(n==='f'&&faces.length<30000){let q=p.map(v=>parseInt(v.split('/')[0],10)).map(i=>i<0?verts.length+i:i-1);if(q.length>2&&q.every(i=>i>=0&&i<verts.length))faces.push(q)}}if(verts.length>2&&faces.length){out.innerHTML='<canvas width="700" height="300" role="img" aria-label="Mesh preview"></canvas>';let c=out.querySelector('canvas').getContext('2d'),lim=Math.max(1,...verts.map(v=>Math.hypot(...v))),a=state.view==='2D'?0:.65;let pts=verts.map(v=>{let x=v[0]*Math.cos(a)+v[2]*Math.sin(a),z=-v[0]*Math.sin(a)+v[2]*Math.cos(a),k=state.view==='3D'?3/(3+z/lim):1;return[350+x*115/lim*k,150+v[1]*115/lim*k]});let edges=new Set();c.strokeStyle='#80d8c6';for(let f of faces)for(let i=0;i<f.length;i++){let a=f[i],b=f[(i+1)%f.length],k=[a,b].sort((x,y)=>x-y).join(':');if(edges.has(k))continue;edges.add(k);c.beginPath();c.moveTo(...pts[a]);c.lineTo(...pts[b]);c.stroke()}return}}
 out.textContent='Exact source bytes stored locally. Preview decoder not admitted for this format.'}
function render(){document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x.dataset.tab===state.tab)});$('surface').innerHTML=shell();$('profile').value=state.profile;let drop=$('drop');if(drop){drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',async e=>{e.preventDefault();drop.classList.remove('drag');let files=await collectDrop(e.dataTransfer);await importFiles(files)})}if(state.tab==='inspect')preview();$('tagState').textContent=state.memOnly?'Session-only review':'Local · IndexedDB'}
async function collectDrop(dt){let out=[];const items=Array.from(dt.items||[]);async function walk(entry,path){if(out.length>=MAX_FILES)return;if(entry.isFile){let f=await new Promise(ok=>entry.file(ok,()=>ok(null)));if(f){f.cgxPath=path+f.name;out.push(f)}}else if(entry.isDirectory){let reader=entry.createReader();for(;;){let entries=await new Promise(ok=>reader.readEntries(ok,()=>ok([])));if(!entries.length)break;for(let x of entries)await walk(x,path+entry.name+'/')}}}
